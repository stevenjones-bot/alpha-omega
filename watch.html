<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Omega Promotions — Your staff is your brand</title><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f3f1fa;color:#2b2b33;font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.hdr{background:#2d1b4e;color:#ffffff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;font-family:Arial,Helvetica,sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase}
.hdr img{height:34px;width:auto;display:block}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:24px;line-height:1.25;margin:0 0 12px}
.vid{position:relative;width:100%;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
video{display:block;width:100%;height:auto}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 10px}
.btn{display:inline-block;padding:14px 22px;border-radius:8px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;text-decoration:none;background:#c41230;color:#ffffff}
.btn.alt{background:transparent;border:2px solid #c41230;color:#c41230}
.sig{font-size:15px;opacity:.85;margin-top:18px;line-height:1.5}
</style></head><body>
<div class="hdr"><img src="email/ao_logo_hdr.png" alt="Alpha Omega Promotions"><span>Alpha Omega Promotions</span></div>
<div class="wrap">
<h1 id="ttl">Your staff is your brand</h1>
<div class="vid"><video id="film" controls playsinline preload="metadata" poster="email/ao_e1_thumb.jpg"><source src="ao_film_v5_web.mp4" type="video/mp4"></video></div>
<div class="btns"><a class="btn" id="book" href="https://meet-steven.zohobookings.com/alpha-omega-15" target="_blank" rel="noopener">&#9654;&nbsp; Grab a 15-minute slot</a><a class="btn alt" id="store" href="https://www.promoplace.com/nexion" target="_blank" rel="noopener">Tour a sample uniform store</a></div>
<p class="sig">Steven Jones · Alpha Omega Promotions · 214-885-3725</p>
</div>
<script>
(function(){
var q=new URLSearchParams(location.search), v=(q.get('v')||'anonymous').trim().toLowerCase(), f=q.get('f')==='short'?'short':'main';
var vid=document.getElementById('film');
if(f==='short'){vid.poster='email/ao_c_thumb.jpg';vid.querySelector('source').src='ao_clickers_web.mp4';vid.load();document.getElementById('ttl').textContent='The two-minute version';}
var sent={};
function log(ev,pct){
  var key=ev+':'+(pct||0); if(sent[key])return; sent[key]=1;
  var body=JSON.stringify({SingleLine:'AO',SingleLine1:v,SingleLine2:ev+(f==='short'?' (short)':''),SingleLine3:String(pct||0)});
  try{ if(navigator.sendBeacon){ navigator.sendBeacon('https://forms.zohopublic.com/thelasthouseontheblock1/form/FilmWatchLog/formperma/D4ogKhL73b3Jy7uXw0MPcYvcrDcD3Zi7nqzZ6IXU-7o/records', new Blob([body],{type:'text/plain'})); return; } }catch(e){}
  try{ fetch('https://forms.zohopublic.com/thelasthouseontheblock1/form/FilmWatchLog/formperma/D4ogKhL73b3Jy7uXw0MPcYvcrDcD3Zi7nqzZ6IXU-7o/records',{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:body}); }catch(e){}
}
log('open',0);
vid.addEventListener('play',function(){log('play',0);});
var marks=[25,50,75];
vid.addEventListener('timeupdate',function(){
  if(!vid.duration)return; var p=vid.currentTime/vid.duration*100;
  marks.forEach(function(m){ if(p>=m) log('watched',m); });
  if(p>=95) log('finished',100);
});
vid.addEventListener('ended',function(){log('finished',100);});
document.getElementById('book').addEventListener('click',function(){log('book-click',0);});
var s=document.getElementById('store'); if(s) s.addEventListener('click',function(){log('store-click',0);});
})();
</script>
</body></html>
